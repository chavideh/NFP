<div class="mb-4">
    <a routerLink="/users/new" class="btn btn-primary">Add User</a>
</div>
<div class="table-responsive">
<table class="table table-bordered">
    <thead>
        <tr>
            <th>Username</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>National Code</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let item of users">
            <td>{{ item.userName }}</td>
            <td>{{ item.firstName }}</td>
            <td>{{ item.lastName }}</td>
            <td>{{ item.email }}</td>
            <td>{{ item.nationalCode }}</td>
        </tr>
    </tbody>
</table>
</div>
